name: Validate skills catalog

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install optional strict YAML parser
        run: python -m pip install --quiet pyyaml
      - name: Lint skill conventions
        run: python tools/lint_skills.py
      - name: Test helper scripts
        run: python tools/test_scripts.py
